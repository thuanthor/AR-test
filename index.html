<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR demo - MindAR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <!-- Nạp trước mô hình 3D (bỏ chú thích khi đã có file model.glb) -->
    <!--
    <a-assets>
      <a-asset-item id="model" src="./model.glb"></a-asset-item>
    </a-assets>
    -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = ảnh đích duy nhất trong targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Khung viền xanh đúng bằng ảnh đích (rộng 1, cao 364/425 ≈ 0.857) để kiểm tra bám ảnh -->
      <a-plane position="0 0 0" width="1" height="0.857" color="#00c2ff" opacity="0.25"></a-plane>

      <!-- Nội dung AR tạm: khối lập phương xoay -->
      <a-box position="0 0 0.15" scale="0.3 0.3 0.3" color="#ff5a5f"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>

      <!-- Khi có mô hình .glb: xóa a-box ở trên và dùng dòng dưới -->
      <!-- <a-gltf-model src="#model" position="0 0 0" rotation="90 0 0" scale="0.5 0.5 0.5"></a-gltf-model> -->

    </a-entity>
  </a-scene>
</body>
</html>
